[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-whisper"
version = "0.2.0"
description = "Local, offline voice dictation and video subtitling with faster-whisper (CTranslate2) on NVIDIA GPUs."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "hamzah sheikh alashrah" }]
requires-python = ">=3.9"
keywords = [
    "speech-recognition",
    "whisper",
    "faster-whisper",
    "dictation",
    "subtitles",
    "offline",
    "cuda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Hamzamn19/whisper"

[tool.pytest.ini_options]
testpaths = ["tests"]
